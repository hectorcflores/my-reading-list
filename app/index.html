<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>My Reading List</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --ink: #fafafa;
      --ink-2: #e4e4e7;
      --muted: #a1a1aa;
      --line: #27272a;
      --chip: #27272a;
      --hover: rgba(250, 250, 250, 0.08);
      --surface: #09090b;
      --issue: #f87171;
      --ok: #4ade80;
      font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    a {
      color: inherit;
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .shell {
      display: grid;
      gap: 22px;
      width: min(760px, calc(100vw - 28px));
      padding: 34px 26px 28px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .sync-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--issue);
    }

    .sync-status[data-status="synced"]::before,
    .sync-status[data-status="saving"]::before {
      background: var(--ok);
    }

    .sync-status[data-status="saving"]::before {
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.16);
      }
    }

    .composer {
      display: grid;
      gap: 10px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 138px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      color: var(--ink);
      background: var(--chip);
      line-height: 1.45;
    }

    textarea:focus {
      outline: none;
      border-color: var(--ink-2);
      box-shadow: 0 0 0 3px rgba(250, 250, 250, 0.15);
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .primary {
      min-width: 132px;
      padding: 0 18px;
      background: var(--ink);
      color: #18181b;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .primary:hover {
      background: var(--ink-2);
    }

    .message {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
    }

    .message[data-tone="issue"] {
      color: var(--issue);
    }

    .message[data-tone="ok"] {
      color: var(--ok);
    }

    .list-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    h2 {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .url-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .url-item {
      display: grid;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px 14px;
      background: var(--chip);
    }

    .url-item a:hover {
      color: var(--ink-2);
    }

    .url-item .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .url-item time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      margin: 0;
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 18px 14px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    @media (max-width: 540px) {
      .shell {
        padding: 22px 18px 24px;
      }

      .topbar,
      .list-header {
        align-items: start;
        flex-direction: column;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .primary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="My Reading List">
    <header class="topbar">
      <h1>My Reading List</h1>
      <div class="sync-status" id="syncStatus" data-status="local">Setup needed</div>
    </header>

    <section class="composer" aria-label="Save URLs">
      <label for="urlInput">Paste URLs (one per line, optionally followed by a short description)</label>
      <textarea id="urlInput" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="actions">
        <p class="message" id="message" aria-live="polite"></p>
        <button class="primary" id="saveButton" type="button">Save</button>
      </div>
    </section>

    <section aria-label="Saved URLs">
      <div class="list-header">
        <h2>Saved URLs</h2>
        <div class="count" id="count">0 links</div>
      </div>
      <ul class="url-list" id="urlList"></ul>
      <p class="empty" id="emptyState">No URLs saved yet.</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      collection,
      doc,
      getDocs,
      getFirestore,
      limit,
      orderBy,
      query,
      runTransaction,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const syncConfigStorageKey = "my-reading-list.sync-config.v1";
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const queryParams = new URLSearchParams(window.location.search);

    const els = {
      syncStatus: document.querySelector("#syncStatus"),
      urlInput: document.querySelector("#urlInput"),
      saveButton: document.querySelector("#saveButton"),
      message: document.querySelector("#message"),
      urlList: document.querySelector("#urlList"),
      emptyState: document.querySelector("#emptyState"),
      count: document.querySelector("#count")
    };

    let syncConfig = null;
    let urls = [];
    let firestore = null;

    function loadSyncConfig() {
      if (typeof localStorage === "undefined") return null;

      try {
        return JSON.parse(localStorage.getItem(syncConfigStorageKey) || "null");
      } catch {
        return null;
      }
    }

    function saveSyncConfig(config) {
      if (typeof localStorage === "undefined") return false;

      try {
        localStorage.setItem(syncConfigStorageKey, JSON.stringify(config));
        return true;
      } catch {
        return false;
      }
    }

    async function configureSyncFromUrl() {
      const apiKey = hashParams.get("fb_api_key") || queryParams.get("fb_api_key");
      const authDomain = hashParams.get("fb_auth_domain") || queryParams.get("fb_auth_domain");
      const projectId = hashParams.get("fb_project_id") || queryParams.get("fb_project_id");
      const appId = hashParams.get("fb_app_id") || queryParams.get("fb_app_id");
      const syncKey = hashParams.get("sync_key") || queryParams.get("sync_key");

      if (!apiKey || !authDomain || !projectId || !appId || !syncKey) {
        return loadSyncConfig();
      }

      const config = {
        apiKey,
        authDomain,
        projectId,
        appId,
        syncKeyHash: await sha256(syncKey)
      };

      saveSyncConfig(config);
      window.history.replaceState({}, document.title, window.location.pathname);
      return config;
    }

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function isSyncEnabled() {
      return Boolean(
        syncConfig
        && syncConfig.apiKey
        && syncConfig.authDomain
        && syncConfig.projectId
        && syncConfig.appId
        && syncConfig.syncKeyHash
      );
    }

    function setSyncStatus(label, status = "local") {
      els.syncStatus.textContent = label;
      els.syncStatus.dataset.status = status;
    }

    function setMessage(text, tone = "") {
      els.message.textContent = text;
      if (tone) {
        els.message.dataset.tone = tone;
      } else {
        delete els.message.dataset.tone;
      }
    }

    function getDb() {
      if (!isSyncEnabled()) return null;
      if (firestore) return firestore;

      const app = initializeApp({
        apiKey: syncConfig.apiKey,
        authDomain: syncConfig.authDomain,
        projectId: syncConfig.projectId,
        appId: syncConfig.appId
      });
      firestore = getFirestore(app);
      return firestore;
    }

    function urlsCollection() {
      return collection(getDb(), "reading_lists", syncConfig.syncKeyHash, "urls");
    }

    function parseUrls(value) {
      const lines = value
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);

      const valid = [];
      const invalid = [];
      const seen = new Set();

      lines.forEach((line) => {
        const [token, ...rest] = line.split(/\s+/);
        const normalized = normalizeUrl(token);
        if (!normalized) {
          invalid.push(line);
          return;
        }

        if (!seen.has(normalized)) {
          seen.add(normalized);
          valid.push({ url: normalized, description: rest.join(" ") });
        }
      });

      return { valid, invalid };
    }

    function normalizeUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== "http:" && url.protocol !== "https:") return null;
        return url.href;
      } catch {
        return null;
      }
    }

    function formatCreatedAt(value) {
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function renderList() {
      els.count.textContent = `${urls.length} ${urls.length === 1 ? "link" : "links"}`;
      els.emptyState.hidden = urls.length > 0;
      els.urlList.innerHTML = urls.map((item) => {
        const safeUrl = escapeHtml(item.url);
        const safeDate = escapeHtml(formatCreatedAt(item.created_at));
        const description = item.description
          ? `<span class="desc">${escapeHtml(item.description)}</span>`
          : "";
        return `
          <li class="url-item">
            <div><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>${description ? " — " + description : ""}</div>
            <time datetime="${escapeHtml(item.created_at)}">${safeDate}</time>
          </li>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadRemoteUrls() {
      if (!isSyncEnabled()) {
        setSyncStatus("Setup needed", "local");
        urls = [];
        renderList();
        return false;
      }

      try {
        setSyncStatus("Syncing", "saving");
        const snapshot = await getDocs(query(urlsCollection(), orderBy("createdAt", "desc"), limit(500)));
        urls = snapshot.docs.map((entry) => {
          const data = entry.data();
          return {
            id: entry.id,
            url: data.url,
            description: data.description || "",
            created_at: data.createdAt && typeof data.createdAt.toDate === "function"
              ? data.createdAt.toDate().toISOString()
              : new Date().toISOString()
          };
        });
        renderList();
        setSyncStatus("Synced", "synced");
        return true;
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
        return false;
      }
    }

    async function saveUrls() {
      const { valid, invalid } = parseUrls(els.urlInput.value);

      if (valid.length === 0) {
        setMessage(invalid.length > 0 ? "Paste a valid http:// or https:// URL." : "Paste at least one URL.", "issue");
        return;
      }

      if (!isSyncEnabled()) {
        setSyncStatus("Setup needed", "local");
        setMessage("Sync setup is needed before URLs can be saved.", "issue");
        return;
      }

      els.saveButton.disabled = true;
      setSyncStatus("Saving", "saving");
      setMessage("Saving...", "");

      try {
        await Promise.all(valid.map((item) => createRemoteUrl(item.url, item.description)));
        els.urlInput.value = invalid.join("\n");
        await loadRemoteUrls();

        const invalidMessage = invalid.length > 0
          ? ` ${invalid.length} invalid ${invalid.length === 1 ? "entry was" : "entries were"} left in the box.`
          : "";
        setMessage(`Saved ${valid.length} ${valid.length === 1 ? "URL" : "URLs"}.${invalidMessage}`, invalid.length > 0 ? "issue" : "ok");
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
        setMessage("Could not save. Check Firebase setup and try again.", "issue");
      } finally {
        els.saveButton.disabled = false;
      }
    }

    async function createRemoteUrl(url, description) {
      const target = doc(getDb(), "reading_lists", syncConfig.syncKeyHash, "urls", await sha256(url));
      await runTransaction(getDb(), async (transaction) => {
        const existing = await transaction.get(target);
        if (existing.exists()) return;

        transaction.set(target, {
          url,
          description: description || "",
          createdAt: Timestamp.fromDate(new Date())
        });
      });
    }

    els.saveButton.addEventListener("click", saveUrls);
    els.urlInput.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        saveUrls();
      }
    });

    window.addEventListener("focus", () => {
      loadRemoteUrls();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadRemoteUrls();
    });

    async function init() {
      syncConfig = await configureSyncFromUrl();
      setSyncStatus(isSyncEnabled() ? "Syncing" : "Setup needed", isSyncEnabled() ? "saving" : "local");
      await loadRemoteUrls();
    }

    init();
  </script>
</body>
</html>
