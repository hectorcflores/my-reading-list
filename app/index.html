<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>My Reading List</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #5f6368;
      --line: #d7d7d7;
      --line-strong: #111111;
      --surface: #ffffff;
      --soft: #f6f6f6;
      --issue: #b00020;
      --ok: #0b7a3b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    a {
      color: inherit;
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .shell {
      display: grid;
      gap: 22px;
      width: min(780px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 7px;
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sync-status::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: var(--issue);
    }

    .sync-status[data-status="synced"]::before,
    .sync-status[data-status="saving"]::before {
      background: var(--ok);
    }

    .sync-status[data-status="saving"]::before {
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.16);
      }
    }

    .composer {
      display: grid;
      gap: 10px;
    }

    label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 138px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 14px;
      color: var(--ink);
      background: var(--surface);
      line-height: 1.45;
    }

    textarea:focus {
      outline: 3px solid #cce4ff;
      outline-offset: 2px;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .primary {
      min-width: 132px;
      padding: 0 18px;
      background: #111111;
      color: #ffffff;
    }

    .primary:hover {
      background: #303030;
    }

    .format-picker {
      display: inline-flex;
      width: max-content;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      overflow: hidden;
    }

    .format-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .format-option span {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 16px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .format-option input:checked + span {
      background: #111111;
      color: #ffffff;
    }

    .format-option input:focus-visible + span {
      outline: 3px solid #cce4ff;
      outline-offset: -3px;
    }

    .message {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .message[data-tone="issue"] {
      color: var(--issue);
    }

    .message[data-tone="ok"] {
      color: var(--ok);
    }

    .list-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .url-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .url-item {
      display: grid;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: var(--surface);
    }

    .url-item time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .item-title {
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .item-url {
      color: var(--muted);
      font-size: 13px;
    }

    .item-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .format-tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .episode-status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .episode-status[data-tone="issue"] {
      color: var(--issue);
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0 14px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .play-btn:hover {
      background: var(--soft);
    }

    .play-btn[data-playing="true"] {
      background: #111111;
      color: #ffffff;
    }

    .empty {
      margin: 0;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px 14px;
      color: var(--muted);
      background: var(--soft);
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 540px) {
      .shell {
        padding: 22px 0;
      }

      .topbar,
      .list-header {
        align-items: start;
        flex-direction: column;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .primary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="My Reading List">
    <header class="topbar">
      <h1>My Reading List</h1>
      <div class="sync-status" id="syncStatus" data-status="local">Setup needed</div>
    </header>

    <section class="composer" aria-label="Save URLs">
      <label for="urlInput">Paste URLs</label>
      <textarea id="urlInput" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="format-picker" role="radiogroup" aria-label="Episode format">
        <label class="format-option">
          <input type="radio" name="episodeFormat" value="tldr" checked>
          <span>TLDR</span>
        </label>
        <label class="format-option">
          <input type="radio" name="episodeFormat" value="deep">
          <span>Deep dive</span>
        </label>
      </div>
      <div class="actions">
        <p class="message" id="message" aria-live="polite"></p>
        <button class="primary" id="saveButton" type="button">Save</button>
      </div>
    </section>

    <section aria-label="Saved URLs">
      <div class="list-header">
        <h2>Saved URLs</h2>
        <div class="count" id="count">0 links</div>
      </div>
      <ul class="url-list" id="urlList"></ul>
      <p class="empty" id="emptyState">No URLs saved yet.</p>
    </section>

    <audio id="player" preload="none"></audio>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      collection,
      doc,
      getDocs,
      getFirestore,
      limit,
      orderBy,
      query,
      runTransaction,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const syncConfigStorageKey = "my-reading-list.sync-config.v1";
    const githubRepo = "hectorcflores/my-reading-list";
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const queryParams = new URLSearchParams(window.location.search);

    const els = {
      syncStatus: document.querySelector("#syncStatus"),
      urlInput: document.querySelector("#urlInput"),
      saveButton: document.querySelector("#saveButton"),
      message: document.querySelector("#message"),
      urlList: document.querySelector("#urlList"),
      emptyState: document.querySelector("#emptyState"),
      count: document.querySelector("#count"),
      player: document.querySelector("#player")
    };

    let syncConfig = null;
    let urls = [];
    let episodes = {};
    let firestore = null;
    let playingId = null;
    let episodePollTimer = null;
    let episodePollTicks = 0;

    const playbackStorageKey = "my-reading-list.playback.v1";

    function loadSyncConfig() {
      if (typeof localStorage === "undefined") return null;

      try {
        return JSON.parse(localStorage.getItem(syncConfigStorageKey) || "null");
      } catch {
        return null;
      }
    }

    function saveSyncConfig(config) {
      if (typeof localStorage === "undefined") return false;

      try {
        localStorage.setItem(syncConfigStorageKey, JSON.stringify(config));
        return true;
      } catch {
        return false;
      }
    }

    async function configureSyncFromUrl() {
      const apiKey = hashParams.get("fb_api_key") || queryParams.get("fb_api_key");
      const authDomain = hashParams.get("fb_auth_domain") || queryParams.get("fb_auth_domain");
      const projectId = hashParams.get("fb_project_id") || queryParams.get("fb_project_id");
      const appId = hashParams.get("fb_app_id") || queryParams.get("fb_app_id");
      const syncKey = hashParams.get("sync_key") || queryParams.get("sync_key");
      const ghToken = hashParams.get("gh_token") || queryParams.get("gh_token");
      const stored = loadSyncConfig();

      if (!apiKey || !authDomain || !projectId || !appId || !syncKey) {
        // Allow adding/refreshing just the GitHub token after initial setup.
        if (ghToken && stored) {
          const config = { ...stored, ghToken };
          saveSyncConfig(config);
          window.history.replaceState({}, document.title, window.location.pathname);
          return config;
        }
        return stored;
      }

      const config = {
        apiKey,
        authDomain,
        projectId,
        appId,
        syncKeyHash: await sha256(syncKey),
        ghToken: ghToken || stored?.ghToken || ""
      };

      saveSyncConfig(config);
      window.history.replaceState({}, document.title, window.location.pathname);
      return config;
    }

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function isSyncEnabled() {
      return Boolean(
        syncConfig
        && syncConfig.apiKey
        && syncConfig.authDomain
        && syncConfig.projectId
        && syncConfig.appId
        && syncConfig.syncKeyHash
      );
    }

    function setSyncStatus(label, status = "local") {
      els.syncStatus.textContent = label;
      els.syncStatus.dataset.status = status;
    }

    function setMessage(text, tone = "") {
      els.message.textContent = text;
      if (tone) {
        els.message.dataset.tone = tone;
      } else {
        delete els.message.dataset.tone;
      }
    }

    function getDb() {
      if (!isSyncEnabled()) return null;
      if (firestore) return firestore;

      const app = initializeApp({
        apiKey: syncConfig.apiKey,
        authDomain: syncConfig.authDomain,
        projectId: syncConfig.projectId,
        appId: syncConfig.appId
      });
      firestore = getFirestore(app);
      return firestore;
    }

    function urlsCollection() {
      return collection(getDb(), "reading_lists", syncConfig.syncKeyHash, "urls");
    }

    function parseUrls(value) {
      const tokens = value
        .split(/\s+/)
        .map((token) => token.trim())
        .filter(Boolean);

      const valid = [];
      const invalid = [];
      const seen = new Set();

      tokens.forEach((token) => {
        const normalized = normalizeUrl(token);
        if (!normalized) {
          invalid.push(token);
          return;
        }

        if (!seen.has(normalized)) {
          seen.add(normalized);
          valid.push(normalized);
        }
      });

      return { valid, invalid };
    }

    function normalizeUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== "http:" && url.protocol !== "https:") return null;
        return url.href;
      } catch {
        return null;
      }
    }

    function formatCreatedAt(value) {
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function fallbackTitle(url) {
      try {
        const parsed = new URL(url);
        const trimmedPath = parsed.pathname.replace(/\/+$/, "");
        return parsed.hostname + (trimmedPath.length > 1 ? trimmedPath : "");
      } catch {
        return url;
      }
    }

    function formatDuration(totalSeconds) {
      const seconds = Math.max(0, Math.round(totalSeconds || 0));
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function renderEpisodeStatus(item, entry) {
      if (entry?.status === "failed") {
        return `<span class="episode-status" data-tone="issue">Episode failed: ${escapeHtml(entry.error || "unknown error")}</span>`;
      }
      if (entry?.status === "ready" && entry.audioPath) {
        const isPlaying = item.id === playingId && !els.player.paused;
        return `
          <button class="play-btn" type="button" data-id="${escapeHtml(item.id)}" data-playing="${isPlaying}">
            ${isPlaying ? "&#10074;&#10074; Pause" : "&#9654; Play"}
          </button>
          <span class="episode-status">${escapeHtml(formatDuration(entry.durationSec))}</span>
        `;
      }
      return `<span class="episode-status">Generating&hellip;</span>`;
    }

    function renderList() {
      els.count.textContent = `${urls.length} ${urls.length === 1 ? "link" : "links"}`;
      els.emptyState.hidden = urls.length > 0;
      els.urlList.innerHTML = urls.map((item) => {
        const entry = episodes[item.id];
        const safeUrl = escapeHtml(item.url);
        const safeDate = escapeHtml(formatCreatedAt(item.created_at));
        const title = entry?.title || fallbackTitle(item.url);
        return `
          <li class="url-item">
            <div class="item-title">${escapeHtml(title)}</div>
            <a class="item-url" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>
            <div class="item-meta">
              <time datetime="${escapeHtml(item.created_at)}">${safeDate}</time>
              <span class="format-tag">${item.format === "deep" ? "Deep dive" : "TLDR"}</span>
              ${renderEpisodeStatus(item, entry)}
            </div>
          </li>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadEpisodes() {
      try {
        const response = await fetch(`./episodes.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        episodes = (await response.json()) || {};
      } catch {
        // Status file may not be deployed yet; items just show as generating.
      }
    }

    function hasPendingEpisodes() {
      return urls.some((item) => !episodes[item.id]);
    }

    function scheduleEpisodePolling() {
      if (!hasPendingEpisodes()) {
        if (episodePollTimer) {
          clearInterval(episodePollTimer);
          episodePollTimer = null;
        }
        return;
      }
      if (episodePollTimer) return;

      episodePollTicks = 0;
      episodePollTimer = setInterval(async () => {
        episodePollTicks += 1;
        await loadEpisodes();
        renderList();
        // Give up after ~20 minutes; the next visit or save resumes polling.
        if (!hasPendingEpisodes() || episodePollTicks >= 60) {
          clearInterval(episodePollTimer);
          episodePollTimer = null;
        }
      }, 20000);
    }

    async function requestEpisodeGeneration() {
      if (!syncConfig?.ghToken) return false;

      try {
        const response = await fetch(
          `https://api.github.com/repos/${githubRepo}/actions/workflows/podcast.yml/dispatches`,
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${syncConfig.ghToken}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ ref: "main" })
          }
        );
        return response.status === 204;
      } catch {
        return false;
      }
    }

    async function refresh() {
      await Promise.all([loadEpisodes(), loadRemoteUrls()]);
      renderList();
      scheduleEpisodePolling();
    }

    async function loadRemoteUrls() {
      if (!isSyncEnabled()) {
        setSyncStatus("Setup needed", "local");
        urls = [];
        renderList();
        return false;
      }

      try {
        setSyncStatus("Syncing", "saving");
        const snapshot = await getDocs(query(urlsCollection(), orderBy("createdAt", "desc"), limit(500)));
        urls = snapshot.docs.map((entry) => {
          const data = entry.data();
          return {
            id: entry.id,
            url: data.url,
            created_at: data.createdAt && typeof data.createdAt.toDate === "function"
              ? data.createdAt.toDate().toISOString()
              : new Date().toISOString(),
            format: data.format === "deep" ? "deep" : "tldr"
          };
        });
        renderList();
        setSyncStatus("Synced", "synced");
        return true;
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
        return false;
      }
    }

    async function saveUrls() {
      const { valid, invalid } = parseUrls(els.urlInput.value);

      if (valid.length === 0) {
        setMessage(invalid.length > 0 ? "Paste a valid http:// or https:// URL." : "Paste at least one URL.", "issue");
        return;
      }

      if (!isSyncEnabled()) {
        setSyncStatus("Setup needed", "local");
        setMessage("Sync setup is needed before URLs can be saved.", "issue");
        return;
      }

      els.saveButton.disabled = true;
      setSyncStatus("Saving", "saving");
      setMessage("Saving...", "");

      const format = document.querySelector("input[name='episodeFormat']:checked")?.value || "tldr";

      try {
        await Promise.all(valid.map((url) => createRemoteUrl(url, format)));
        els.urlInput.value = invalid.join("\n");
        await refresh();
        const triggered = await requestEpisodeGeneration();

        const invalidMessage = invalid.length > 0
          ? ` ${invalid.length} invalid ${invalid.length === 1 ? "entry was" : "entries were"} left in the box.`
          : "";
        const episodeMessage = triggered ? " Generating episodes now." : "";
        setMessage(`Saved ${valid.length} ${valid.length === 1 ? "URL" : "URLs"}.${episodeMessage}${invalidMessage}`, invalid.length > 0 ? "issue" : "ok");
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
        setMessage("Could not save. Check Firebase setup and try again.", "issue");
      } finally {
        els.saveButton.disabled = false;
      }
    }

    async function createRemoteUrl(url, format) {
      const target = doc(getDb(), "reading_lists", syncConfig.syncKeyHash, "urls", await sha256(url));
      await runTransaction(getDb(), async (transaction) => {
        const existing = await transaction.get(target);
        if (existing.exists()) return;

        transaction.set(target, {
          url,
          createdAt: Timestamp.fromDate(new Date()),
          format
        });
      });
    }

    function loadPlaybackPositions() {
      try {
        return JSON.parse(localStorage.getItem(playbackStorageKey) || "{}");
      } catch {
        return {};
      }
    }

    function savePlaybackPosition(id, seconds) {
      const positions = loadPlaybackPositions();
      if (seconds === null) {
        delete positions[id];
      } else {
        positions[id] = seconds;
      }
      try {
        localStorage.setItem(playbackStorageKey, JSON.stringify(positions));
      } catch {
        // Position memory is best-effort.
      }
    }

    function togglePlayback(id) {
      if (id === playingId) {
        if (els.player.paused) {
          els.player.play();
        } else {
          els.player.pause();
        }
        return;
      }

      const entry = episodes[id];
      if (!entry?.audioPath) return;

      playingId = id;
      els.player.src = `./${entry.audioPath}`;
      els.player.play();
    }

    els.urlList.addEventListener("click", (event) => {
      const button = event.target.closest(".play-btn");
      if (button) togglePlayback(button.dataset.id);
    });

    els.player.addEventListener("loadedmetadata", () => {
      const saved = loadPlaybackPositions()[playingId];
      if (saved > 0 && saved < els.player.duration - 5) {
        els.player.currentTime = saved;
      }
    });

    let lastPositionSave = 0;
    els.player.addEventListener("timeupdate", () => {
      if (!playingId || els.player.paused) return;
      const now = Date.now();
      if (now - lastPositionSave < 5000) return;
      lastPositionSave = now;
      savePlaybackPosition(playingId, Math.floor(els.player.currentTime));
    });

    els.player.addEventListener("ended", () => {
      savePlaybackPosition(playingId, null);
      playingId = null;
      renderList();
    });

    els.player.addEventListener("play", renderList);
    els.player.addEventListener("pause", () => {
      if (playingId) savePlaybackPosition(playingId, Math.floor(els.player.currentTime));
      renderList();
    });

    els.saveButton.addEventListener("click", saveUrls);
    els.urlInput.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        saveUrls();
      }
    });

    window.addEventListener("focus", () => {
      refresh();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refresh();
    });

    async function init() {
      syncConfig = await configureSyncFromUrl();
      setSyncStatus(isSyncEnabled() ? "Syncing" : "Setup needed", isSyncEnabled() ? "saving" : "local");
      await refresh();
    }

    init();
  </script>
</body>
</html>
