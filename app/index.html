<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>My Reading List</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --ink: #fafafa;
      --ink-2: #e4e4e7;
      --muted: #a1a1aa;
      --line: #27272a;
      --chip: #27272a;
      --hover: rgba(250, 250, 250, 0.08);
      --surface: #09090b;
      --issue: #f87171;
      --ok: #4ade80;
      font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    a {
      color: inherit;
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .shell {
      display: grid;
      gap: 22px;
      width: min(760px, calc(100vw - 28px));
      padding: 34px 26px 28px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .sync-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--issue);
    }

    .sync-status[data-status="synced"]::before,
    .sync-status[data-status="saving"]::before {
      background: var(--ok);
    }

    .sync-status[data-status="saving"]::before {
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.16);
      }
    }

    .composer {
      display: grid;
      gap: 10px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 138px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      color: var(--ink);
      background: var(--chip);
      line-height: 1.45;
    }

    textarea:focus {
      outline: none;
      border-color: var(--ink-2);
      box-shadow: 0 0 0 3px rgba(250, 250, 250, 0.15);
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .primary {
      min-width: 132px;
      padding: 0 18px;
      background: var(--ink);
      color: #18181b;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .primary:hover {
      background: var(--ink-2);
    }

    .message {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
    }

    .message[data-tone="issue"] {
      color: var(--issue);
    }

    .message[data-tone="ok"] {
      color: var(--ok);
    }

    .list-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    h2 {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .url-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .url-item {
      display: grid;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px 14px;
      background: var(--chip);
    }

    .url-item a:hover {
      color: var(--ink-2);
    }

    .url-item .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .url-item time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      margin: 0;
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 18px 14px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .auth-view {
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 38px 0 26px;
      text-align: center;
    }

    .auth-view p {
      max-width: 40ch;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .google-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: var(--ink);
      color: #18181b;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .google-button:hover {
      background: var(--ink-2);
    }

    .google-button svg {
      flex: 0 0 auto;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .account-row button {
      min-height: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .account-row button:hover {
      color: var(--ink-2);
    }

    .auth-alt {
      min-height: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .auth-alt:hover {
      color: var(--ink-2);
    }

    .password-form {
      display: grid;
      gap: 8px;
      width: min(320px, 100%);
      justify-self: center;
      margin: 0 auto;
    }

    .password-form.set-password {
      margin-top: 10px;
    }

    .auth-input {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--chip);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--ink-2);
    }

    .hint-line {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .hint-line[data-tone="issue"] {
      color: var(--issue);
    }

    .hint-line[data-tone="ok"] {
      color: var(--ok);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 540px) {
      .shell {
        padding: 22px 18px 24px;
      }

      .topbar,
      .list-header {
        align-items: start;
        flex-direction: column;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .primary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="My Reading List">
    <header class="topbar">
      <h1>My Reading List</h1>
      <div class="sync-status" id="syncStatus" data-status="local">Loading</div>
    </header>

    <section class="auth-view" id="authView">
      <p id="authMessage">One list, on every device.</p>
      <div class="password-form" id="passwordForm" hidden>
        <input class="auth-input" id="passwordEmail" type="email" autocomplete="username" placeholder="you@gmail.com">
        <input class="auth-input" id="passwordInput" type="password" autocomplete="current-password" placeholder="password">
        <button class="google-button" id="passwordSignInButton" type="button">Sign in</button>
      </div>
      <button class="google-button" id="signInButton" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <button class="auth-alt" id="passwordToggle" type="button" hidden>Use a password instead (restricted computers)</button>
    </section>

    <section class="composer" id="composerView" aria-label="Save URLs" hidden>
      <label for="urlInput">Paste URLs (one per line, optionally followed by a short description)</label>
      <textarea id="urlInput" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="actions">
        <p class="message" id="message" aria-live="polite"></p>
        <button class="primary" id="saveButton" type="button">Save</button>
      </div>
    </section>

    <section id="listView" aria-label="Saved URLs" hidden>
      <div class="list-header">
        <h2>Saved URLs</h2>
        <div class="count" id="count">0 links</div>
      </div>
      <ul class="url-list" id="urlList"></ul>
      <p class="empty" id="emptyState">No URLs saved yet.</p>
    </section>

    <p class="account-row" id="accountRow" hidden>
      <span id="accountEmail"></span>
      <span>·</span>
      <button id="setPasswordToggle" type="button">Set password</button>
      <span>·</span>
      <button id="signOutButton" type="button">Sign out</button>
    </p>
    <div class="password-form set-password" id="setPasswordForm" hidden>
      <input class="auth-input" id="setPasswordInput" type="password" autocomplete="new-password" placeholder="new password (6+ characters)">
      <button class="google-button" id="setPasswordButton" type="button">Save</button>
      <p class="hint-line" id="setPasswordHint"></p>
    </div>
  </main>

  <script>
    // Core app: everything except Firebase itself. The module script at the
    // bottom builds real services from the Firebase SDK and calls App.start;
    // tests can call App.start with fakes instead.
    (function () {
      const legacyConfigStorageKey = "my-reading-list.sync-config.v1";
      const migratedStorageKey = "my-reading-list.migrated.v1";

      const els = {
        syncStatus: document.querySelector("#syncStatus"),
        authView: document.querySelector("#authView"),
        authMessage: document.querySelector("#authMessage"),
        signInButton: document.querySelector("#signInButton"),
        passwordToggle: document.querySelector("#passwordToggle"),
        passwordForm: document.querySelector("#passwordForm"),
        passwordEmail: document.querySelector("#passwordEmail"),
        passwordInput: document.querySelector("#passwordInput"),
        passwordSignInButton: document.querySelector("#passwordSignInButton"),
        setPasswordToggle: document.querySelector("#setPasswordToggle"),
        setPasswordForm: document.querySelector("#setPasswordForm"),
        setPasswordInput: document.querySelector("#setPasswordInput"),
        setPasswordButton: document.querySelector("#setPasswordButton"),
        setPasswordHint: document.querySelector("#setPasswordHint"),
        composerView: document.querySelector("#composerView"),
        listView: document.querySelector("#listView"),
        urlInput: document.querySelector("#urlInput"),
        saveButton: document.querySelector("#saveButton"),
        message: document.querySelector("#message"),
        urlList: document.querySelector("#urlList"),
        emptyState: document.querySelector("#emptyState"),
        count: document.querySelector("#count"),
        accountRow: document.querySelector("#accountRow"),
        accountEmail: document.querySelector("#accountEmail"),
        signOutButton: document.querySelector("#signOutButton")
      };

      let services = null;
      let user = null;
      let urls = [];

      function storageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          /* storage unavailable — migration will retry next load */
        }
      }

      async function sha256(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function setSyncStatus(label, status = "local") {
        els.syncStatus.textContent = label;
        els.syncStatus.dataset.status = status;
      }

      function setMessage(text, tone = "") {
        els.message.textContent = text;
        if (tone) {
          els.message.dataset.tone = tone;
        } else {
          delete els.message.dataset.tone;
        }
      }

      function showSignedOut(message) {
        els.authView.hidden = false;
        els.authMessage.textContent = message || "One list, on every device.";
        els.signInButton.hidden = false;
        els.passwordToggle.hidden = false;
        els.passwordForm.hidden = true;
        els.composerView.hidden = true;
        els.listView.hidden = true;
        els.accountRow.hidden = true;
        els.setPasswordForm.hidden = true;
        setSyncStatus("Signed out", "local");
      }

      function showUnavailable(message) {
        els.authView.hidden = false;
        els.authMessage.textContent = message;
        els.signInButton.hidden = true;
        els.passwordToggle.hidden = true;
        els.passwordForm.hidden = true;
        els.composerView.hidden = true;
        els.listView.hidden = true;
        els.accountRow.hidden = true;
        els.setPasswordForm.hidden = true;
        setSyncStatus("Offline", "issue");
      }

      function showSignedIn() {
        els.authView.hidden = true;
        els.composerView.hidden = false;
        els.listView.hidden = false;
        els.accountRow.hidden = false;
        els.setPasswordForm.hidden = true;
        els.setPasswordHint.textContent = "";
        els.accountEmail.textContent = user.email
          ? `Signed in as ${user.email}`
          : "Signed in";
      }

      function parseUrls(value) {
        const lines = value
          .split(/\n+/)
          .map((line) => line.trim())
          .filter(Boolean);

        const valid = [];
        const invalid = [];
        const seen = new Set();

        lines.forEach((line) => {
          const [token, ...rest] = line.split(/\s+/);
          const normalized = normalizeUrl(token);
          if (!normalized) {
            invalid.push(line);
            return;
          }

          if (!seen.has(normalized)) {
            seen.add(normalized);
            valid.push({ url: normalized, description: rest.join(" ") });
          }
        });

        return { valid, invalid };
      }

      function normalizeUrl(value) {
        try {
          const url = new URL(value);
          if (url.protocol !== "http:" && url.protocol !== "https:") return null;
          return url.href;
        } catch {
          return null;
        }
      }

      function formatCreatedAt(value) {
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderList() {
        els.count.textContent = `${urls.length} ${urls.length === 1 ? "link" : "links"}`;
        els.emptyState.hidden = urls.length > 0;
        els.urlList.innerHTML = urls.map((item) => {
          const safeUrl = escapeHtml(item.url);
          const safeDate = escapeHtml(formatCreatedAt(item.created_at));
          const description = item.description
            ? `<span class="desc">${escapeHtml(item.description)}</span>`
            : "";
          return `
            <li class="url-item">
              <div><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>${description ? " — " + description : ""}</div>
              <time datetime="${escapeHtml(item.created_at)}">${safeDate}</time>
            </li>
          `;
        }).join("");
      }

      async function loadRemoteUrls() {
        if (!user) return false;

        try {
          setSyncStatus("Syncing", "saving");
          urls = await services.listUrls(user.uid);
          renderList();
          setSyncStatus("Synced", "synced");
          return true;
        } catch (error) {
          console.warn(error);
          setSyncStatus("Sync issue", "issue");
          return false;
        }
      }

      async function saveUrls() {
        if (!user) return;

        const { valid, invalid } = parseUrls(els.urlInput.value);

        if (valid.length === 0) {
          setMessage(invalid.length > 0 ? "Paste a valid http:// or https:// URL." : "Paste at least one URL.", "issue");
          return;
        }

        els.saveButton.disabled = true;
        setSyncStatus("Saving", "saving");
        setMessage("Saving...", "");

        try {
          await Promise.all(valid.map(async (item) => services.createUrl(user.uid, {
            id: await sha256(item.url),
            url: item.url,
            description: item.description,
            createdAt: new Date()
          })));
          els.urlInput.value = invalid.join("\n");
          await loadRemoteUrls();

          const invalidMessage = invalid.length > 0
            ? ` ${invalid.length} invalid ${invalid.length === 1 ? "entry was" : "entries were"} left in the box.`
            : "";
          setMessage(`Saved ${valid.length} ${valid.length === 1 ? "URL" : "URLs"}.${invalidMessage}`, invalid.length > 0 ? "issue" : "ok");
        } catch (error) {
          console.warn(error);
          setSyncStatus("Sync issue", "issue");
          setMessage("Could not save. Try again.", "issue");
        } finally {
          els.saveButton.disabled = false;
        }
      }

      // One-time copy of bookmark-era data (reading_lists/{sha256 of old sync
      // key}) into the signed-in account. Idempotent: doc ids are preserved
      // and createUrl is create-only, so re-running never duplicates.
      async function migrateLegacyIfNeeded() {
        if (!user || storageGet(migratedStorageKey) === "done") return;

        let legacy = null;
        try {
          legacy = JSON.parse(storageGet(legacyConfigStorageKey) || "null");
        } catch {
          legacy = null;
        }

        if (!legacy || !legacy.syncKeyHash) {
          storageSet(migratedStorageKey, "done");
          return;
        }

        try {
          const rows = await services.listLegacyUrls(legacy.syncKeyHash);
          for (const row of rows) {
            await services.createUrl(user.uid, {
              id: row.id,
              url: row.url,
              description: row.description || "",
              createdAt: new Date(row.created_at)
            });
          }
          storageSet(migratedStorageKey, "done");
          if (rows.length > 0) await loadRemoteUrls();
        } catch (error) {
          // Leave the flag unset so the next load retries.
          console.warn("Legacy migration failed:", error);
        }
      }

      async function onAuthChange(nextUser) {
        user = nextUser;
        if (!user) {
          urls = [];
          showSignedOut();
          return;
        }

        showSignedIn();
        await loadRemoteUrls();
        await migrateLegacyIfNeeded();
      }

      els.saveButton.addEventListener("click", saveUrls);
      els.urlInput.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          saveUrls();
        }
      });
      els.signInButton.addEventListener("click", async () => {
        try {
          await services.signIn();
        } catch (error) {
          console.warn(error);
          showSignedOut("Sign-in didn't complete. Try again.");
        }
      });
      els.signOutButton.addEventListener("click", () => services.signOutUser());

      // Password side door: sign-in without Google's account picker, for
      // managed computers that pin the browser to a work account. The
      // password is set below while signed in with Google, so both methods
      // land on the same account and the same data.
      els.passwordToggle.addEventListener("click", () => {
        els.passwordForm.hidden = !els.passwordForm.hidden;
        if (!els.passwordForm.hidden) els.passwordEmail.focus();
      });

      async function passwordSignIn() {
        const email = els.passwordEmail.value.trim();
        const password = els.passwordInput.value;
        if (!email || !password) return;
        try {
          await services.signInWithPassword(email, password);
          els.passwordInput.value = "";
        } catch (error) {
          console.warn(error);
          showSignedOut("That email + password didn't work. Set the password from a signed-in device first.");
          els.passwordForm.hidden = false;
        }
      }

      els.passwordSignInButton.addEventListener("click", passwordSignIn);
      els.passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") passwordSignIn();
      });

      els.setPasswordToggle.addEventListener("click", () => {
        els.setPasswordForm.hidden = !els.setPasswordForm.hidden;
        if (!els.setPasswordForm.hidden) els.setPasswordInput.focus();
      });

      function setPasswordHint(text, tone = "") {
        els.setPasswordHint.textContent = text;
        if (tone) {
          els.setPasswordHint.dataset.tone = tone;
        } else {
          delete els.setPasswordHint.dataset.tone;
        }
      }

      els.setPasswordButton.addEventListener("click", async () => {
        const password = els.setPasswordInput.value;
        if (!user) return;
        if (!user.email) {
          setPasswordHint("This account has no email address to attach a password to.", "issue");
          return;
        }
        if (password.length < 6) {
          setPasswordHint("Use at least 6 characters.", "issue");
          return;
        }
        try {
          await services.setPassword(user.email, password);
          els.setPasswordInput.value = "";
          setPasswordHint(`Password set. On restricted computers, sign in with ${user.email} + this password.`, "ok");
        } catch (error) {
          console.warn(error);
          if (error && error.code === "auth/requires-recent-login") {
            setPasswordHint("For safety, sign out, sign back in, and set the password right away.", "issue");
          } else {
            setPasswordHint("Couldn't set the password. Try again.", "issue");
          }
        }
      });

      window.addEventListener("focus", () => {
        loadRemoteUrls();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadRemoteUrls();
      });

      window.App = {
        start(nextServices) {
          services = nextServices;
          setSyncStatus("Loading", "local");
          services.onAuthChange(onAuthChange);
        },
        unavailable(error) {
          console.warn(error);
          showUnavailable("Couldn't reach Google sign-in. Check your connection and reload.");
        },
        _test: { parseUrls, normalizeUrl, escapeHtml, sha256 }
      };
    })();
  </script>

  <script type="module">
    // Firebase web config is public by design; identity and access control
    // come from Google sign-in + Firestore rules, not from these values.
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyA5_DhdTdqjCVDeOgklUFcnJ1lwfESiP8Y",
      authDomain: "my-reading-list-3fa75.firebaseapp.com",
      projectId: "my-reading-list-3fa75",
      appId: "1:101190488885:web:f0401ddd67b862f163b27c"
    };

    (async () => {
      try {
        const [{ initializeApp }, authMod, fs] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
        ]);

        const app = initializeApp(FIREBASE_CONFIG);
        const auth = authMod.getAuth(app);
        const db = fs.getFirestore(app);
        const provider = new authMod.GoogleAuthProvider();

        authMod.getRedirectResult(auth).catch((error) => console.warn(error));

        function rowFromDoc(entry) {
          const data = entry.data();
          return {
            id: entry.id,
            url: data.url,
            description: data.description || "",
            created_at: data.createdAt && typeof data.createdAt.toDate === "function"
              ? data.createdAt.toDate().toISOString()
              : new Date().toISOString()
          };
        }

        async function listTenantUrls(tenantId) {
          const snapshot = await fs.getDocs(fs.query(
            fs.collection(db, "reading_lists", tenantId, "urls"),
            fs.orderBy("createdAt", "desc"),
            fs.limit(500)
          ));
          return snapshot.docs.map(rowFromDoc);
        }

        window.App.start({
          onAuthChange(callback) {
            authMod.onAuthStateChanged(auth, (firebaseUser) => {
              callback(firebaseUser ? { uid: firebaseUser.uid, email: firebaseUser.email } : null);
            });
          },
          async signIn() {
            try {
              await authMod.signInWithPopup(auth, provider);
            } catch (error) {
              const popupIssues = [
                "auth/popup-blocked",
                "auth/popup-closed-by-user",
                "auth/cancelled-popup-request",
                "auth/operation-not-supported-in-this-environment"
              ];
              if (popupIssues.includes(error.code)) {
                await authMod.signInWithRedirect(auth, provider);
              } else {
                throw error;
              }
            }
          },
          signOutUser: () => authMod.signOut(auth),
          signInWithPassword: (email, password) =>
            authMod.signInWithEmailAndPassword(auth, email, password),
          // Attach (or replace) a password on the CURRENT account, so both
          // sign-in methods resolve to the same uid and the same data.
          async setPassword(email, password) {
            const credential = authMod.EmailAuthProvider.credential(email, password);
            try {
              await authMod.linkWithCredential(auth.currentUser, credential);
            } catch (error) {
              if (error && error.code === "auth/provider-already-linked") {
                await authMod.updatePassword(auth.currentUser, password);
              } else {
                throw error;
              }
            }
          },
          listUrls: (uid) => listTenantUrls(uid),
          listLegacyUrls: (hash) => listTenantUrls(hash),
          async createUrl(uid, { id, url, description, createdAt }) {
            const target = fs.doc(db, "reading_lists", uid, "urls", id);
            await fs.runTransaction(db, async (transaction) => {
              const existing = await transaction.get(target);
              if (existing.exists()) return;

              transaction.set(target, {
                url,
                description: description || "",
                createdAt: fs.Timestamp.fromDate(createdAt)
              });
            });
          }
        });
      } catch (error) {
        window.App.unavailable(error);
      }
    })();
  </script>
