name: Generate podcast episodes

on:
  workflow_dispatch:
  schedule:
    # Backup sweep in case an instant trigger was missed.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci --prefix pipeline

      - name: Generate episodes
        run: node pipeline/src/index.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}

      - name: Commit audio and status
        run: |
          git config user.name "podcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/episodes app/episodes.json
          git diff --cached --quiet && exit 0
          git commit -m "Add generated episodes"
          git pull --rebase origin main
          git push
