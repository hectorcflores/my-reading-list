name: Generate podcast episodes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci --prefix pipeline

      - name: Generate episodes
        run: node pipeline/src/index.js generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit audio
        run: |
          git config user.name "podcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/episodes
          git diff --cached --quiet && exit 0
          git commit -m "Add generated episodes"
          git pull --rebase origin main
          git push

      - name: Finalize Firestore status
        run: node pipeline/src/index.js finalize
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
